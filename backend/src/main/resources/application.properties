# ─────────────────────────────────────────────
# BytePath Backend — Application Configuration
# ─────────────────────────────────────────────

spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.application.name=bytepath-backend
server.port=${PORT:8081}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# ── PostgreSQL ─────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bytepath}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:bytepath}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JPA / Hibernate ───────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT Configuration ─────────────────────────
# IMPORTANT: Replace this with a long, random secret in production!
jwt.secret=${JWT_SECRET:BytePathSuperSecretKeyForJWTSigningMustBeAtLeast256BitsLong2024!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# ── Google OAuth ─────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID:304383053062-q8puqdo1k58hso50lspmvejt8b6avvgv.apps.googleusercontent.com}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.callback-url=${GOOGLE_CALLBACK_URL:http://localhost:8081/api/auth/google/callback}

# ── GitHub OAuth ─────────────────────────────────
github.client-id=${GITHUB_CLIENT_ID:}
github.client-secret=${GITHUB_CLIENT_SECRET:}
github.callback-url=${GITHUB_CALLBACK_URL:http://localhost:8081/api/auth/github/callback}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ── Admin seed ───────────────────────────────────
admin.email=${ADMIN_EMAIL:admin@bytepath.local}
admin.password=${ADMIN_PASSWORD:change-me-in-development}
admin.name=${ADMIN_NAME:System Administrator}

# ── Cors Origins (update for your deployed frontend URL) ──
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://byte.college,https://www.byte.college}

# ── Springdoc / Swagger ───────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ───────────────────────────────────
logging.level.com.bytepath=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN

# ── ByteAI RAG provider (server-side only) ─────
# Set these as environment variables; never expose the key through Vite.
rag.api.url=${RAG_API_URL:}
rag.api.key=${RAG_API_KEY:}
rag.api.auth-header=${RAG_API_AUTH_HEADER:Authorization}
rag.api.auth-prefix=${RAG_API_AUTH_PREFIX:Bearer }

# ── OpenRouter AI (server-side only) ─────────────────
# Never put OPENROUTER_API_KEY in frontend/.env.
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
openrouter.site-url=${OPENROUTER_SITE_URL:http://localhost:5173}

# ── Supabase Storage (server-side only) ──────────
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.bucket-name=${SUPABASE_BUCKET_NAME:ByteStudy}

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# SMTP for verification and password reset mail
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@bytepath.app}
app.auth.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}
tesseract.path=${TESSERACT_PATH:/usr/bin/tesseract}
